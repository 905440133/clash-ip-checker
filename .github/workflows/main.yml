name: IP Check and Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

      - name: Install Mihomo Core
        run: |
          wget -O mihomo.gz https://github.com/MetaCubeX/mihomo/releases/download/v1.18.7/mihomo-linux-amd64-v1.18.7.gz
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/clash

      - name: Fetch Profile and Start Local Proxy
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
        run: |
          curl -sSL -A "ClashforWindows/0.20.39" "${SUB_URL}" -o config.yaml || true
          if [ -s config.yaml ]; then
            nohup clash -f config.yaml > clash.log 2>&1 &
            sleep 5
            echo "HTTP_PROXY=http://127.0.0.1:7890" >> $GITHUB_ENV
            echo "HTTPS_PROXY=http://127.0.0.1:7890" >> $GITHUB_ENV
            echo "✅ 本地代理已成功启动！"
          else
            echo "⚠️ 无法下载配置建立代理，将直接发起请求"
          fi

      - name: Run IP Check
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
        run: |
          python main.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
